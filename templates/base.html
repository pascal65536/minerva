<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Анализатор Python-проектов</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/brands.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/regular.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/solid.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/svg.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/svg-with-js.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v4-font-face.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v4-shims.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/v5-font-face.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fontawesome.min.css') }}">

    <!-- Ваши стили -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body class="bg-light">
    {% include 'settings.html' %}

    <!-- === Основной контент === -->
    <div class="container-fluid py-4">
        <h1 class="mb-4">Анализатор Python-проектов</h1>

        <!-- Flash-сообщения -->
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
        {% for category, message in messages %}
        <div class="alert alert-{{ 'danger' if category == 'error' else category }} alert-dismissible fade show" role="alert">
            {{ message }}
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/fontawesome.min.js ') }}"></script>

    <script>
    document.addEventListener('DOMContentLoaded', function() {
        applySavedSettings();
        if (typeof Prism !== 'undefined') {
            const prismEnabled = localStorage.getItem('prismEnabled') !== 'false';
            if (prismEnabled) {
                Prism.highlightAll();
            }
        }
    });

    function resetSettings() {
        localStorage.removeItem('analyzerSettings');
        location.reload();
    }
    </script>

</body>
</html>
