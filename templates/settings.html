<button class="btn btn-outline-secondary position-fixed top-0 end-0 m-3 z-3" 
        type="button" 
        data-bs-toggle="offcanvas" 
        data-bs-target="#settingsOffcanvas" 
        aria-controls="settingsOffcanvas"
        title="Настройки"><i class="fa fa-cog" aria-hidden="true"></i> Настройка
</button>

<div class="offcanvas offcanvas-end" tabindex="-1" id="settingsOffcanvas" aria-labelledby="settingsLabel">
    <div class="offcanvas-header bg-primary text-white">
        <h5 class="offcanvas-title" id="settingsLabel"><i class="fa fa-cog" aria-hidden="true"></i> Настройки</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Закрыть"></button>
    </div>

    <div class="offcanvas-body">

        <form method="POST" action="/settings">
            {{ form.hidden_tag() }}

            <div class="d-grid gap-2 d-md-flex justify-content-md-end mb-4">
                <a href="{{ url_for('index') }}" class="btn btn-outline-secondary">Назад</a>
                <button type="button" class="btn btn-outline-warning" onclick="return confirm('Сбросить все настройки?')">Сбросить</button>
                {{ form.submit(class="btn btn-primary px-4") }}
            </div>
        </form>
        
    </div>

</div>
